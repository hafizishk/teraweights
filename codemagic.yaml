# Cloud iOS build. Produces a signed .ipa and uploads it to TestFlight.
# Nothing here needs a Mac: Codemagic generates the Xcode project from
# capacitor.config.ts on every run, so the ios/ folder is never committed.
#
# One-time setup is in docs/IOS-BUILD.md.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the App Store Connect integration name in
      # Codemagic > Teams > Integrations. Rename there or here if it differs.
      app_store_connect: teraweights

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "sg.teraweights.app"
        XCODE_SCHEME: "App"
        # The deployed site the native shell loads. Change here if the
        # production URL changes; capacitor.config.ts reads APP_URL.
        APP_URL: "https://teraweights.vercel.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate the Xcode project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Icon and splash
        script: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#0b0b0b' \
            --splashBackgroundColor '#0b0b0b'
          npx cap sync ios

      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$(node -p "require('../../package.json').version")" || true
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      # Signing is done by hand rather than through environment.ios_signing,
      # because the automatic path only looks for existing profiles and fails
      # on a first build. --create bootstraps the bundle ID, the distribution
      # certificate and the App Store profile, and is a no-op afterwards.
      - name: Register the bundle ID
        script: |
          app-store-connect create-bundle-id "$BUNDLE_ID" \
            --name "Teraweights" --platform IOS --yes || true

      - name: Fetch or create signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      # Capacitor 8 uses Swift Package Manager, so it generates only
      # App.xcodeproj and no .xcworkspace. Older Capacitor and any project
      # that pulls in CocoaPods does produce a workspace, so handle both.
      - name: Build the ipa
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No beta_groups here on purpose: the build lands in TestFlight and
        # testers are added in the browser afterwards, so there is no group to
        # create before the first build. Add a beta_groups list later to
        # distribute automatically.

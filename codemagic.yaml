# Cloud iOS build. Produces a signed .ipa and uploads it to TestFlight.
# Nothing here needs a Mac: Codemagic generates the Xcode project from
# capacitor.config.ts on every run, so the ios/ folder is never committed.
#
# One-time setup is in docs/IOS-BUILD.md.
#
# How signing works here, because it took several failures to learn:
#   - The Apple team already has distribution certificates from other apps.
#     Codemagic can list them but holds none of their private keys, so it can
#     sign with none of them and will not create another on its own.
#   - So a certificate is generated inside Codemagic (Code signing identities
#     > iOS certificates > Generate), reference name teraweights_dist. Codemagic
#     keeps its private key and imports it into the keychain before scripts run.
#   - Codemagic's automatic ios_signing only matches profiles it already
#     holds; it does not create one. So the App Store profile is created
#     below through the App Store Connect API, which needs no private key,
#     and is written to disk for xcodebuild.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the App Store Connect integration name in
      # Codemagic > Personal Account > Integrations.
      app_store_connect: teraweights

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - teraweights_dist
      vars:
        BUNDLE_ID: "sg.teraweights.app"
        XCODE_SCHEME: "App"
        PROFILE_NAME: "Teraweights App Store"
        # The deployed site the native shell loads. Change here if the
        # production URL changes; capacitor.config.ts reads APP_URL.
        APP_URL: "https://teraweights.vercel.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate the Xcode project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Icon and splash
        script: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#0b0b0b' \
            --splashBackgroundColor '#0b0b0b'
          npx cap sync ios

      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$(node -p "require('../../package.json').version")" || true
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Create the App Store provisioning profile
        script: |
          set -e
          SIGN_DIR="$CM_BUILD_DIR/signing"
          mkdir -p "$SIGN_DIR"

          echo "--- bundle id ---"
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --platform IOS --json > /tmp/bids.json 2>/dev/null || echo "[]" > /tmp/bids.json
          BID=$(python3 -c 'import json; d=json.load(open("/tmp/bids.json")); print(d[0]["id"] if d else "")')
          if [ -z "$BID" ]; then
            app-store-connect create-bundle-id "$BUNDLE_ID" --name "Teraweights" --platform IOS --json > /tmp/bid.json
            BID=$(python3 -c 'import json; print(json.load(open("/tmp/bid.json"))["id"])')
          fi
          echo "bundle id resource: $BID"

          echo "--- distribution certificates on the team ---"
          app-store-connect list-certificates --type DISTRIBUTION --json > /tmp/c1.json 2>/dev/null || echo "[]" > /tmp/c1.json
          app-store-connect list-certificates --type IOS_DISTRIBUTION --json > /tmp/c2.json 2>/dev/null || echo "[]" > /tmp/c2.json
          CERT_IDS=$(python3 -c '
          import json, sys, datetime
          now = datetime.datetime.utcnow().isoformat()
          ids = []
          for f in ("/tmp/c1.json", "/tmp/c2.json"):
              try: data = json.load(open(f))
              except Exception: data = []
              for c in data:
                  a = c.get("attributes", {})
                  if a.get("expirationDate", "9999") > now:
                      ids.append(c["id"])
                      print("  ", c["id"], a.get("displayName"), a.get("certificateType"), str(a.get("expirationDate"))[:10], file=sys.stderr)
          print(" ".join(ids))
          ')
          [ -n "$CERT_IDS" ] || { echo "No valid distribution certificate on the team. Generate one in Codemagic, Code signing identities."; exit 1; }

          echo "--- profile ---"
          app-store-connect list-profiles --type IOS_APP_STORE --json > /tmp/profiles.json 2>/dev/null || echo "[]" > /tmp/profiles.json
          for id in $(python3 -c 'import json,os; print(" ".join(p["id"] for p in json.load(open("/tmp/profiles.json")) if p["attributes"]["name"]==os.environ["PROFILE_NAME"]))'); do
            echo "replacing old profile $id"
            app-store-connect delete-profile "$id" || true
          done
          app-store-connect create-profile \
            --bundle-id-resource-id "$BID" \
            --certificate-resource-ids $CERT_IDS \
            --type IOS_APP_STORE \
            --name "$PROFILE_NAME" \
            --save --profiles-dir "$SIGN_DIR" --json > /tmp/created.json
          ls -la "$SIGN_DIR"
          ls "$SIGN_DIR"/*.mobileprovision >/dev/null 2>&1 || { echo "create-profile saved nothing"; exit 1; }

          # Xcode 16 and later read ~/Library/Developer/Xcode/UserData/Provisioning Profiles;
          # older Xcode reads ~/Library/MobileDevice/Provisioning Profiles. Install in both.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$SIGN_DIR"/*.mobileprovision "$d"/
          done

      - name: Show what got signed
        script: |
          echo "--- identities in keychain ---"
          security find-identity -v -p codesigning || true
          echo "--- profiles on disk ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" || true

      # Signing is passed to xcodebuild explicitly, read off the profile
      # created above. Capacitor 8 generates only App.xcodeproj (Swift Package
      # Manager, no CocoaPods, no workspace), so the project is built directly.
      - name: Build the ipa
        script: |
          set -e
          PROFILE=$(ls -t "$CM_BUILD_DIR/signing"/*.mobileprovision 2>/dev/null | head -1)
          [ -n "$PROFILE" ] || { echo "No provisioning profile in $CM_BUILD_DIR/signing"; exit 1; }
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist)
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) team: $TEAM_ID"

          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CODE_SIGN_IDENTITY=\"Apple Distribution\" PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" \
            --export-options-plist /tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No beta_groups here on purpose: the build lands in TestFlight and
        # testers are added in the browser afterwards, so there is no group to
        # create before the first build. Add a beta_groups list later to
        # distribute automatically.

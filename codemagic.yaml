# Cloud iOS build. Produces a signed .ipa and uploads it to TestFlight.
# Nothing here needs a Mac: Codemagic generates the Xcode project from
# capacitor.config.ts on every run, so the ios/ folder is never committed.
#
# One-time setup is in docs/IOS-BUILD.md.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the App Store Connect integration name in
      # Codemagic > Teams > Integrations. Rename there or here if it differs.
      app_store_connect: teraweights

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      # Uses the Apple Distribution certificate generated in Codemagic,
      # Personal Account > Code signing identities > iOS certificates >
      # Generate certificate. Codemagic holds that certificate's private key,
      # so it can fetch or create the App Store profile for the bundle ID.
      # A certificate Apple already has but whose key Codemagic lacks is
      # useless to it: that is the "Cannot save Signing Certificates without
      # certificate private key" failure.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sg.teraweights.app
      vars:
        BUNDLE_ID: "sg.teraweights.app"
        XCODE_SCHEME: "App"
        # The deployed site the native shell loads. Change here if the
        # production URL changes; capacitor.config.ts reads APP_URL.
        APP_URL: "https://teraweights.vercel.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Generate the Xcode project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Icon and splash
        script: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#0b0b0b' \
            --splashBackgroundColor '#0b0b0b'
          npx cap sync ios

      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$(node -p "require('../../package.json').version")" || true
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Show what got signed
        script: |
          echo "--- profiles on disk ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" || true
          echo "--- signing build settings ---"
          xcodebuild -project ios/App/App.xcodeproj -target App \
            -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY" || true

      # Signing is passed to xcodebuild explicitly, read off the downloaded
      # profile, rather than trusting use-profiles to have patched the
      # project. Capacitor 8 generates only App.xcodeproj (Swift Package
      # Manager, no CocoaPods, no workspace), so the project is built directly.
      - name: Build the ipa
        script: |
          set -e
          PROFILE=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision \
                          "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
                          2>/dev/null | head -1)
          [ -n "$PROFILE" ] || { echo "No provisioning profile installed by ios_signing"; exit 1; }
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist)
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) team: $TEAM_ID"

          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CODE_SIGN_IDENTITY=\"Apple Distribution\" PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" \
            --export-options-plist /tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No beta_groups here on purpose: the build lands in TestFlight and
        # testers are added in the browser afterwards, so there is no group to
        # create before the first build. Add a beta_groups list later to
        # distribute automatically.

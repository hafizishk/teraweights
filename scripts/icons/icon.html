<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #0B0B0B; width: 512px; height: 512px; overflow: hidden; }
  .wrap { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; background: #0B0B0B; }
  .wrap.maskable .t { transform: scale(0.72); }
  .t { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .tw { font: 800 210px/1 Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; color: #F4F1EC; }
  .tw span { color: #B11226; }
  svg { width: 360px; height: 60px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="t">
    <div class="tw">T<span>W</span></div>
    <svg viewBox="0 0 360 60" fill="none" stroke="#B11226" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <polyline points="0,30 110,30 128,30 142,8 160,52 176,18 190,30 360,30" />
    </svg>
  </div>
</div>
<script>
  var params = new URLSearchParams(location.hash.slice(1));
  if (params.get('maskable')) document.getElementById('wrap').classList.add('maskable');
  var size = Number(params.get('size') || 512);
  document.documentElement.style.zoom = String(size / 512);
</script>
</body>
</html>

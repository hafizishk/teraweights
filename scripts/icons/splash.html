<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Rendered at 1366x1366 with a device scale factor of 2, giving the
     2732x2732 square @capacitor/assets wants. iOS crops it to the device
     aspect from the centre, so everything sits well inside the middle. */
  html, body { margin: 0; background: #0B0B0B; width: 1366px; height: 1366px; overflow: hidden; }
  .wrap { width: 1366px; height: 1366px; display: flex; align-items: center; justify-content: center; background: #0B0B0B; }
  .t { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .word { font: 800 106px/1 Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.01em; color: #F4F1EC; }
  .word span { color: #B11226; }
  svg { width: 470px; height: 46px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="t">
    <div class="word">TERA<span>WEIGHTS</span></div>
    <svg viewBox="0 0 360 60" fill="none" stroke="#B11226" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <polyline points="0,30 110,30 128,30 142,8 160,52 176,18 190,30 360,30" />
    </svg>
  </div>
</div>
</body>
</html>
